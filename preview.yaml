apiVersion: v1
kind: Namespace
metadata:
  name: pr-preview-123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app-pr123
  namespace: pr-preview-123
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend-app-pr123 }
  template:
    metadata:
      labels: { app: frontend-app-pr123 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: site
          configMap:
            name: frontend-app-pr123-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-app-pr123-svc
  namespace: pr-preview-123
spec:
  selector: { app: frontend-app-pr123 }
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80